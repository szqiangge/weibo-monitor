name: 每日监控微博 (UID:2241280342)

on:
  schedule:
    # 每天北京时间 04:30 执行（UTC 前一天 20:30）
    - cron: '30 20 * * *'
    # 每天北京时间 10:00 执行（UTC 02:00）
    - cron: '0 2 * * *'
    # 每天北京时间 23:00 执行（UTC 15:00）
    - cron: '0 15 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许提交记录文件回仓库

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install markdown2 playwright Pillow
          playwright install chromium --with-deps

      - name: 运行监控脚本
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python monitor.py

      - name: 提交监控记录
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weibo_records.json reports/
          git diff --staged --quiet || git commit -m "更新监控记录 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')"
          git push
